<!--
File: pomodoro_review.html
Description: Front-end application for reviewing pomodoro entries with AI-generated summaries.
Parameters: None (client-side application).
Inputs: Loads `pomodoro.txt` from server or local storage, parses timestamped entries.
Processing: Parses entries, groups by date/year/month, displays overview, allows AI summary generation via Google Gemini API, and saves AI logs.
Outputs: Renders interactive UI with entry lists, date navigation, AI summary display, and downloadable AI log.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Reviewer</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for XSS protection -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <!-- Chart.js for productivity graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #111827;
            /* gray-900 */
            color: #f3f4f6;
            /* gray-100 */
        }

        .prose-invert h1,
        .prose-invert h2,
        .prose-invert h3,
        .prose-invert h4 {
            color: #f3f4f6;
        }

        .prose-invert strong {
            color: #fff;
        }

        /* Heatmap Calendar Styles */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(53, 1fr);
            gap: 2px;
        }

        .heatmap-cell {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .heatmap-cell:hover {
            transform: scale(1.3);
        }

        .intensity-0 {
            background: #1f2937;
        }

        .intensity-1 {
            background: #065f46;
        }

        .intensity-2 {
            background: #059669;
        }

        .intensity-3 {
            background: #10b981;
        }

        .intensity-4 {
            background: #34d399;
        }

        /* Stats Cards */
        .stat-card {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #06b6d4, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        // Main application script for Pomodoro Reviewer
        // Lucide Icons wrapper - optimized to run createIcons only once per icon update
        // Lucide Icons wrapper - React Safe Version
        // Uses innerHTML to avoid conflict between React VDOM and Lucide DOM replacement
        const Icon = ({ name, className }) => {
            const ref = React.useRef(null);

            React.useEffect(() => {
                if (!ref.current) return;

                // Convert kebab-case (e.g. "arrow-left") to PascalCase ("ArrowLeft")
                const camelName = name
                    .split('-')
                    .map(part => part.charAt(0).toUpperCase() + part.slice(1))
                    .join('');

                const iconDef = lucide.icons[camelName];

                if (iconDef) {
                    // Clean up previous icon
                    ref.current.innerHTML = '';

                    // Create SVG element using Lucide's createElement
                    // This is required for newer versions where .toSvg() was removed from icon objects
                    const svgElement = lucide.createElement(iconDef);

                    // Add custom classes
                    if (className) {
                        const existingClass = svgElement.getAttribute('class') || '';
                        svgElement.setAttribute('class', `${existingClass} ${className}`.trim());
                    }

                    ref.current.appendChild(svgElement);
                } else {
                    console.warn(`Icon not found: ${name} (tried ${camelName})`);
                }
            }, [name, className]);

            return <span ref={ref} className="inline-flex items-center justify-center" />;
        };

        const Clock = ({ className }) => <Icon name="clock" className={className} />;
        const Calendar = ({ className }) => <Icon name="calendar" className={className} />;
        const ArrowLeft = ({ className }) => <Icon name="arrow-left" className={className} />;
        const Upload = ({ className }) => <Icon name="upload" className={className} />;
        const Sparkles = ({ className }) => <Icon name="sparkles" className={className} />;
        const Key = ({ className }) => <Icon name="key" className={className} />;
        const X = ({ className }) => <Icon name="x" className={className} />;
        const BarChart3 = ({ className }) => <Icon name="bar-chart-3" className={className} />;
        const Flame = ({ className }) => <Icon name="flame" className={className} />;
        const TrendingUp = ({ className }) => <Icon name="trending-up" className={className} />;
        const Activity = ({ className }) => <Icon name="activity" className={className} />;
        const Grid = ({ className }) => <Icon name="grid-3x3" className={className} />;

        const ProductivityChart = ({ labels, notesData, focusData, onBarClick }) => {
            const chartRef = React.useRef(null);
            const canvasRef = React.useRef(null);

            React.useEffect(() => {
                if (!canvasRef.current) return;

                // Destroy existing chart if it exists
                if (chartRef.current) {
                    chartRef.current.destroy();
                }

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Notes',
                            data: notesData,
                            backgroundColor: 'rgba(6, 182, 212, 0.7)',
                            borderColor: 'rgb(6, 182, 212)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        onHover: (event, chartElement) => {
                            event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
                        },
                        onClick: (event, elements) => {
                            if (elements && elements.length > 0) {
                                // Pass the index up
                                onBarClick(elements[0].index);
                            }
                        },
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                ticks: { color: '#9ca3af' }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#9ca3af', maxRotation: 45 }
                            }
                        }
                    }
                });

                // Cleanup on unmount or re-render
                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                        chartRef.current = null;
                    }
                };
            }, [labels, notesData, focusData]);

            return <canvas ref={canvasRef} />;
        };

        const TimeTracker = () => {
            const [entries, setEntries] = React.useState([]);
            const [view, setView] = React.useState('loading');
            const [dates, setDates] = React.useState([]);
            const [groupedDates, setGroupedDates] = React.useState({});
            const [selectedDate, setSelectedDate] = React.useState(null);
            const [loadingError, setLoadingError] = React.useState(null);

            // Gemini State
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
            const [showKeyInput, setShowKeyInput] = React.useState(false);
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [summaries, setSummaries] = React.useState({}); // Changed from single summary to dictionary

            // Analytics State
            const [dailyStats, setDailyStats] = React.useState({});
            const [streak, setStreak] = React.useState({ current: 0, longest: 0 });
            const [heatmapData, setHeatmapData] = React.useState({});
            const [chartRef, setChartRef] = React.useState(null);

            React.useEffect(() => {
                loadData();
            }, []);

            React.useEffect(() => {
                window.scrollTo(0, 0);
            }, [view]);

            React.useEffect(() => {
                if (entries.length > 0) {
                    extractAndGroupDates();
                    // Determine initial view if not already set or invalid
                    if (view === 'loading' || view === 'upload') {
                        setView('overview');
                    }
                } else if (view !== 'loading') {
                    // If entries is empty but view is active, maybe go to upload?
                    // But we might be strictly clearing. Let's stick to upload if empty.
                    if (view !== 'upload') setView('upload');
                }
            }, [entries]);

            const saveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem('gemini_api_key', key);
                setShowKeyInput(false);
            };

            const loadData = async () => {
                // Load summaries from cache
                const cachedSummaries = localStorage.getItem('pomodoro_summaries');
                if (cachedSummaries) {
                    try {
                        setSummaries(JSON.parse(cachedSummaries));
                    } catch (e) {
                        console.error("Failed to parse cached summaries", e);
                    }
                }

                // Try LocalStorage first
                const cachedData = localStorage.getItem('pomodoro_data');
                if (cachedData) {
                    console.log("Loaded from cache");
                    parseFileContent(cachedData);
                    // We don't return here, we can try to refresh from server in background if we wanted,
                    // but for this simple app, cache first is good.
                    // If file fetch fails, we at least have cache.
                }

                try {
                    const response = await fetch('pomodoro.txt');
                    if (response.ok) {
                        const text = await response.text();
                        // Update cache if different? Or just always update.
                        if (text !== cachedData) {
                            console.log("New data found, updating...");
                            localStorage.setItem('pomodoro_data', text);
                            parseFileContent(text);
                        }
                    } else {
                        if (!cachedData) throw new Error('File not found');
                    }
                } catch (error) {
                    console.log('Auto-load failed', error);
                    if (!cachedData) {
                        setLoadingError('Could not load pomodoro.txt and no cache found.');
                        setView('upload');
                    }
                }
            };

            const extractAndGroupDates = () => {
                const uniqueDates = [...new Set(entries.map(entry => {
                    const date = new Date(entry.timestamp);
                    return date.toISOString().split('T')[0];
                }))].sort().reverse();

                setDates(uniqueDates);

                const grouped = {};
                uniqueDates.forEach(date => {
                    const dateObj = new Date(date);
                    const year = dateObj.getFullYear();
                    const month = dateObj.toLocaleString('en-US', { month: 'long' });

                    if (!grouped[year]) {
                        grouped[year] = {};
                    }
                    if (!grouped[year][month]) {
                        grouped[year][month] = [];
                    }
                    grouped[year][month].push(date);
                });

                setGroupedDates(grouped);

                // Calculate statistics when dates are extracted
                calculateStats(uniqueDates);
                calculateStreak(uniqueDates);
                generateHeatmapData(uniqueDates);
            };

            // Calculate daily statistics
            const calculateStats = (uniqueDates) => {
                const stats = {};
                uniqueDates.forEach(date => {
                    const dateEntries = entries.filter(entry => {
                        const entryDate = new Date(entry.timestamp).toISOString().split('T')[0];
                        return entryDate === date;
                    });

                    // Count work phases (entries with "Work" tag)
                    const workPhases = dateEntries.filter(e =>
                        e.tag.toLowerCase().includes('work') ||
                        e.tag.toLowerCase().includes('cycle')
                    ).length;

                    // Count notes (all entries that are actual notes)
                    const notesCount = dateEntries.filter(e =>
                        !e.tag.toLowerCase().includes('goal') &&
                        !e.tag.toLowerCase().includes('skipped')
                    ).length;

                    // Estimate focus minutes (assume default 25 min per work phase)
                    const focusMinutes = workPhases * 25;

                    stats[date] = {
                        workPhases,
                        notesCount,
                        focusMinutes,
                        totalEntries: dateEntries.length
                    };
                });
                setDailyStats(stats);
            };

            // Calculate streak
            const calculateStreak = (uniqueDates) => {
                if (uniqueDates.length === 0) {
                    setStreak({ current: 0, longest: 0 });
                    return;
                }

                // Sort dates in ascending order for streak calculation
                const sortedDates = [...uniqueDates].sort();

                let currentStreak = 1;
                let longestStreak = 1;
                let tempStreak = 1;

                // Check if today or yesterday has entries (for current streak)
                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                const hasRecentActivity = sortedDates.includes(today) || sortedDates.includes(yesterday);

                // Calculate longest streak
                for (let i = 1; i < sortedDates.length; i++) {
                    const prevDate = new Date(sortedDates[i - 1]);
                    const currDate = new Date(sortedDates[i]);
                    const diffDays = (currDate - prevDate) / (1000 * 60 * 60 * 24);

                    if (diffDays === 1) {
                        tempStreak++;
                        longestStreak = Math.max(longestStreak, tempStreak);
                    } else {
                        tempStreak = 1;
                    }
                }

                // Calculate current streak (working backwards from today/yesterday)
                if (hasRecentActivity) {
                    const reversedDates = [...sortedDates].reverse();
                    currentStreak = 1;
                    for (let i = 1; i < reversedDates.length; i++) {
                        const currDate = new Date(reversedDates[i - 1]);
                        const prevDate = new Date(reversedDates[i]);
                        const diffDays = (currDate - prevDate) / (1000 * 60 * 60 * 24);

                        if (diffDays === 1) {
                            currentStreak++;
                        } else {
                            break;
                        }
                    }
                } else {
                    currentStreak = 0;
                }

                setStreak({ current: currentStreak, longest: longestStreak });
            };

            // Generate heatmap data for the past year
            const generateHeatmapData = (uniqueDates) => {
                if (uniqueDates.length === 0) {
                    setHeatmapData({});
                    return;
                }

                // Determine full date range
                // uniqueDates is sorted descending (newest first).
                // So last element is oldest date.
                const oldestDateStr = uniqueDates[uniqueDates.length - 1];
                const newestDateStr = new Date().toISOString().split('T')[0]; // Always up to today

                const startDate = new Date(oldestDateStr);
                const endDate = new Date(newestDateStr);

                // Adjust start date to the nearest preceding Sunday (to align weeks)
                const startDay = startDate.getDay(); // 0 is Sunday
                startDate.setDate(startDate.getDate() - startDay);

                const heatmap = {};

                // Fill in all days from start to end
                for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    const dateStr = d.toISOString().split('T')[0];
                    heatmap[dateStr] = { intensity: 0, count: 0 };
                }

                // Fill in actual status
                entries.forEach(entry => {
                    const date = new Date(entry.timestamp).toISOString().split('T')[0];
                    if (heatmap[date]) {
                        heatmap[date].count += 1;
                        const c = heatmap[date].count;
                        if (c > 0) heatmap[date].intensity = 1;
                        if (c >= 5) heatmap[date].intensity = 2;
                        if (c >= 10) heatmap[date].intensity = 3;
                        if (c >= 20) heatmap[date].intensity = 4;
                    }
                });

                setHeatmapData(heatmap);
            };

            // Get weekly stats
            const getWeeklyStats = () => {
                const today = new Date();
                const weekAgo = new Date(today);
                weekAgo.setDate(today.getDate() - 7);

                let totalFocus = 0;
                let totalNotes = 0;
                let totalPhases = 0;

                Object.entries(dailyStats).forEach(([date, stats]) => {
                    const dateObj = new Date(date);
                    if (dateObj >= weekAgo && dateObj <= today) {
                        totalFocus += stats.focusMinutes;
                        totalNotes += stats.notesCount;
                        totalPhases += stats.workPhases;
                    }
                });

                return { totalFocus, totalNotes, totalPhases };
            };

            // Get all-time stats
            const getAllTimeStats = () => {
                let totalFocus = 0;
                let totalNotes = 0;
                let totalPhases = 0;

                Object.values(dailyStats).forEach(stats => {
                    totalFocus += stats.focusMinutes;
                    totalNotes += stats.notesCount;
                    totalPhases += stats.workPhases;
                });

                return { totalFocus, totalNotes, totalPhases, totalDays: Object.keys(dailyStats).length };
            };

            // Format minutes to hours and minutes
            const formatDuration = (minutes) => {
                const hours = Math.floor(minutes / 60);
                const mins = minutes % 60;
                if (hours === 0) return `${mins}m`;
                return `${hours}h ${mins}m`;
            };

            const parseEntry = (line) => {
                // Updated regex to handle:
                // 1. Standard: [Timestamp] (Tag): Note
                // 2. Skipped/Status: [Timestamp] (Work - SKIPPED)
                const regex = /\[(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}:\d{2})\]\s*\(([^)]+)\)(?::?\s*(.*))?/;
                const match = line.match(regex);

                if (match) {
                    const [, datePart, timePart, tag, note] = match;
                    const timestamp = `${datePart}T${timePart}`;
                    return {
                        timestamp: new Date(timestamp).toISOString(),
                        tag: tag.trim(),
                        note: note ? note.trim() : "" // Handle empty note
                    };
                }
                return null;
            };

            const parseFileContent = (text) => {
                const lines = text.split('\n').filter(line => line.trim());
                const parsedEntries = lines
                    .map(line => parseEntry(line))
                    .filter(entry => entry !== null);

                setEntries(parsedEntries);
            };

            const saveToAiLog = (dateStr, summaryText) => {
                const separator = "\n\n---\n\n";
                const newEntry = `Date: ${dateStr}\n\n${summaryText}${separator}`;

                // Get existing log or start empty
                let currentLog = localStorage.getItem('pomodoro_ai_log') || "";

                // Avoid rewriting if it looks like the last entry is the same (simple check)
                if (!currentLog.includes(newEntry.trim())) {
                    currentLog += newEntry;
                    localStorage.setItem('pomodoro_ai_log', currentLog);
                    // downloadAiLog(currentLog); // Auto-download removed
                } else {
                    // It exists, maybe just update the file anyway so user gets latest
                    // downloadAiLog(currentLog); // Auto-download removed
                }
            };

            const downloadAiLog = async (content) => {
                // Clean content: remove excessive newlines (3 or more becomes 2)
                const cleanContent = content.replace(/\n{3,}/g, '\n\n');

                // Try to use the modern File System Access API to pick location
                if (window.showSaveFilePicker) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: 'pomodoro_ai.txt',
                            types: [{
                                description: 'Text File',
                                accept: { 'text/plain': ['.txt'] },
                            }],
                        });
                        const writable = await handle.createWritable();
                        await writable.write(cleanContent);
                        await writable.close();
                        return; // Success
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.error('File access error:', err);
                            alert('Could not save to chosen location. Falling back to default download.');
                        } else {
                            return; // User cancelled
                        }
                    }
                }

                // Fallback for browsers without File System Access API
                const blob = new Blob([cleanContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'pomodoro_ai.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // CONFIGURATION: Model and Prompt
            const AI_CONFIG = {
                model: "gemma-3-27b-it", // Updated to use the requested model
                // You can customize the system instruction equivalent here
                basePrompt: `Analyze these time tracking entries and provide a concise summary of the day.
Focus on:
1. Key achievements (Work/Tasks completions).
2. Flow and consistency (disturbances, breaks).
3. Overall mood/productivity based on the notes.
Use professional but encouraging tone and provide points.`,
            };

            const generateSummary = async (dateEntries, dateStr) => {
                if (!apiKey) {
                    setShowKeyInput(true);
                    return;
                }

                setIsGenerating(true);
                // setSummary(null); // Don't clear immediately, allows invalidation visual if needed, but for now just overwrite on success

                const entriesText = dateEntries.map(e =>
                    `[${formatTime(e.timestamp)}] (${e.tag}): ${e.note}`
                ).join('\n');

                // PROMPT CONSTRUCTION: This is where the context is assembled
                const prompt = `${AI_CONFIG.basePrompt}

                Date: ${dateStr}

                Entries:
                ${entriesText}`;

                console.log("Using Model:", AI_CONFIG.model);
                console.log("Sending Prompt:", prompt);

                try {
                    // Using the updated model in the API endpoint
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_CONFIG.model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: prompt }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (data.error) {
                        throw new Error(data.error.message);
                    }

                    // Check if candidates exists
                    if (!data.candidates || data.candidates.length === 0) {
                        throw new Error("No response generated. The model might not support this region or input.");
                    }

                    const text = data.candidates[0].content.parts[0].text;
                    // Update summaries state
                    const newSummaries = { ...summaries, [dateStr]: text };
                    setSummaries(newSummaries);
                    localStorage.setItem('pomodoro_summaries', JSON.stringify(newSummaries));

                    // Append to AI Log
                    saveToAiLog(dateStr, text);

                } catch (error) {
                    alert('Failed to generate summary: ' + error.message);
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                try {
                    const text = await file.text();
                    localStorage.setItem('pomodoro_data', text); // Save to cache
                    parseFileContent(text);
                    setView('overview');
                } catch (error) {
                    console.error('Error reading file:', error);
                    alert('Error reading file. Please try again.');
                }
            };

            const formatTime = (timestamp) => {
                const date = new Date(timestamp);
                return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
            };

            const formatDate = (dateStr) => {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            };

            const getEntriesForDate = (dateStr) => {
                return entries.filter(entry => {
                    const entryDate = new Date(entry.timestamp).toISOString().split('T')[0];
                    return entryDate === dateStr;
                });
            };

            const handleDateSelect = (dateStr) => {
                setSelectedDate(dateStr);
                // setSummary(null); // Removed: Do not clear summary on nav
                setView('details'); // Explicitly switch to details view
                window.scrollTo(0, 0);
            };

            // render markdown with XSS protection via DOMPurify
            const Markdown = ({ content }) => {
                const sanitizedHtml = React.useMemo(() => {
                    const rawHtml = marked.parse(content || '');
                    return DOMPurify.sanitize(rawHtml);
                }, [content]);
                return (
                    <div className="prose prose-invert prose-sm max-w-none" dangerouslySetInnerHTML={{ __html: sanitizedHtml }} />
                );
            };

            // Loading view
            if (view === 'loading') {
                return (
                    <div className="flex items-center justify-center min-h-screen text-gray-400">
                        <p>Loading entries...</p>
                    </div>
                );
            }

            // Upload view (no entries loaded)
            if (view === 'upload' && entries.length === 0) {
                return (
                    <div className="max-w-4xl mx-auto p-4 bg-gray-900 min-h-screen">
                        <div className="bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700">

                                            <div className="space-y-0.5 pl-2">
                                                {dateEntries.map((entry, idx) => (
                                                    <div key={idx} className="font-mono text-xs text-gray-300 p-1 hover:bg-gray-900 rounded flex items-start">
                                                        <span className="text-gray-500 mr-2 whitespace-nowrap">
                                                            [{formatTime(entry.timestamp)}]
                                                        </span>
                                                        {entry.tag && <span className="text-blue-400 font-semibold mr-2 whitespace-nowrap">({entry.tag})</span>}
                                                        <span className="text-gray-300">{entry.note}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                        <p className="text-xs text-gray-600 mt-4 text-center border-t border-gray-800 pt-2">
                            Data is processed locally. Entries are sent to Google Gemini only when you click "Generate AI Summary".
                        </p>
                    </div>
                </div>
            );
        };

        // Error Boundary Component to catch render errors
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                this.setState({ error: error, errorInfo: errorInfo });
                console.error("React Error:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center">
                            <h1 className="text-2xl font-bold text-red-500 mb-4">Something went wrong.</h1>
                            <div className="bg-gray-800 p-4 rounded border border-red-700 max-w-2xl overflow-auto">
                                <p className="font-mono text-sm text-red-300 mb-2">{this.state.error && this.state.error.toString()}</p>
                                <pre className="font-mono text-xs text-gray-400 whitespace-pre-wrap">
                                    {this.state.errorInfo && this.state.errorInfo.componentStack}
                                </pre>
                            </div>
                            <button
                                onClick={() => window.location.reload()}
                                className="mt-6 bg-blue-600 px-4 py-2 rounded hover:bg-blue-500"
                            >
                                Reload Page
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <TimeTracker />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
